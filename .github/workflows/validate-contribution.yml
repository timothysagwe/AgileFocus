name: Validate Contribution

on:
  pull_request:
    paths: [src/data/**]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Get changed files in src/data/
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: src/data/**

      - name: Detect contribution type
        id: detect-type
        run: |
          TYPES=""
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            case "$file" in
              src/data/personas/*)    TYPES="$TYPES persona" ;;
              src/data/scenarios/*)   TYPES="$TYPES scenario" ;;
              src/data/bpmn-exercises/*) TYPES="$TYPES bpmn-exercise" ;;
              src/data/certifications/knowledge-checks*) TYPES="$TYPES knowledge-check" ;;
            esac
          done
          echo "types=$(echo $TYPES | tr ' ' '\n' | sort -u | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Validate schemas
        id: schema-validation
        run: |
          FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          if [ -n "$FILES" ]; then
            echo "$FILES" | tr ' ' '\n' > /tmp/changed-files.txt
            npm run validate-schemas -- --files $(cat /tmp/changed-files.txt | tr '\n' ' ') 2>&1 | tee /tmp/schema-output.txt
            echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        id: tests
        run: |
          npm run test -- --reporter=verbose 2>&1 | tee /tmp/test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Post validation comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Contribution Validation Results

            ### Files Validated
            ${{ steps.changed-files.outputs.all_changed_files || 'None' }}

            ### Contribution Type(s)
            ${{ steps.detect-type.outputs.types || 'Unknown' }}

            ### Schema Validation
            ${{ steps.schema-validation.outputs.exit_code == '0' && '✅ Passed' || '❌ Failed' }}

            ### Test Results
            ${{ steps.tests.outputs.exit_code == '0' && '✅ Passed' || '❌ Failed' }}

            ### Next Steps
            ${{ steps.schema-validation.outputs.exit_code == '0' && steps.tests.outputs.exit_code == '0' && 'All checks passed. A maintainer will review your contribution shortly.' || 'Please fix the issues above and push updates to your branch.' }}

            ---
            *Automated validation by AgileFocus CI*
