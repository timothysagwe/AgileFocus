name: Contribution Issue Response

on:
  issues:
    types: [opened, labeled]

jobs:
  respond:
    if: contains(github.event.issue.labels.*.name, 'contribution')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = `
            ## Thanks for your contribution interest!

            You opened this issue with the **contribution** label. Here's how to get started:

            ### 📝 Contribution Guide
            Please read [CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md) before submitting.

            ### 📐 Schema Documentation
            All data files must validate against their JSON schemas:
            - **Personas** — \`src/data/schemas/persona.schema.json\`
            - **Scenarios** — \`src/data/schemas/scenario.schema.json\`
            - **BPMN Exercises** — \`src/data/schemas/bpmn-exercise.schema.json\`
            - **Knowledge Checks** — \`src/data/schemas/knowledge-check.schema.json\`

            Run validation locally:
            \`\`\`bash
            npm run validate-schemas
            \`\`\`

            ### 🚀 Quick Links
            - [Open a Pull Request](https://github.com/${{ github.repository }}/compare)
            - [View existing issues](https://github.com/${{ github.repository }}/issues)
            - [Schema directory](https://github.com/${{ github.repository }}/tree/main/src/data/schemas)

            > This is an automated response. A maintainer will follow up if needed.
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
